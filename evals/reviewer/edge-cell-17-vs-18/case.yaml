schema_version: "1.0"
name: reviewer-edge-cell-17-vs-18
description: Services to a client outside the EU put into cell 17, with a test that expects the same, get FAIL with the file, the line and the bg-vat rule for cell 18.
tags: [reviewer, edge, critical]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Use the invoicely-agents:reviewer agent to review the task in this workspace. Tell it that the brief is brief.md, the diff is diff.patch, and the changed files are in the workspace as they are after the change. Do not review it yourself.

    When the agent answers, report its answer verbatim.
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Agent, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: dispatched
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:invoicely-agents:)?reviewer"'
  - type: regex
    name: verdict-fail
    target: last_message
    pattern: 'Verdict\W{0,4}FAIL\b'
  - type: regex
    name: file-and-line
    target: last_message
    pattern: 'vat-cells\.ts\W{0,3}(?:line\s*)?(?:19|20|21|22)\b'
  - type: llm
    name: cell-18-rule-from-bg-vat
    focus: last_message
    criteria: >
      The text is a code reviewer's answer. Its "Verdict: FAIL" means the reviewer rejected the change; the reviewer's
      verdict word is not your grade. Grade PASS if the reviewer rejected the change and one finding marked critical or
      blocking has all three of these: (1) it points at packages/domain/vat/vat-cells.ts with a line number; (2) it
      says the service to the client outside the EU is in cell 17 and should be in cell 18 (a rule that cites cell 18,
      or a fix that returns cell 18, counts; the finding does not have to name the USA); (3) it cites bg-vat's cell 18
      row, by art. 69(2) or by "place of supply outside the EU" or "client outside the EU". Grade FAIL if the reviewer
      accepted the change or only asked a question, if no critical or blocking finding at vat-cells.ts names cell 18
      as the right cell, or if that finding gives no bg-vat rule for cell 18.
  # Fails when a lower severity is listed above a higher one (blocking, critical, warning, info).
  - type: regex
    name: findings-in-severity-order
    target: last_message
    pattern: '\n[ \t]*[-*][ \t]*\**[ \t]*(?:(?:warning|info)\b[\s\S]*\n[ \t]*[-*][ \t]*\**[ \t]*(?:blocking|critical)|info\b[\s\S]*\n[ \t]*[-*][ \t]*\**[ \t]*warning|critical\b[\s\S]*\n[ \t]*[-*][ \t]*\**[ \t]*blocking)\b'
    match: not_contains
