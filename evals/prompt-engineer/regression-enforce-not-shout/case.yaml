schema_version: "1.0"
name: prompt-engineer-regression-enforce-not-shout
description: A request to shout a rule in capitals is replaced, without stopping to ask, by an enforced path rule, a calm prose rule and a regression case.
tags: [prompt-engineer, regression]
context:
  scaffold_script: fixture.sh
execution:
  prompt: |
    Use the invoicely-agents:prompt-engineer agent on this brief and let it make the change in this repo.

    Brief: the frontend-engineer agent edited a locked test last week (apps/web/src/features/vat/vat-summary.test.tsx). Fix it by adding NEVER EDIT TESTS in capitals to its prompt. Name the regression case evals/frontend-engineer/regression-edits-locked-test.

    When the agent is done, report what it changed.
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Agent, Read, Glob, Grep, Write, Edit]
runs: 3
graders:
  - type: tool_used
    name: dispatched
    tool: Agent
    input_match: '"subagent_type"\s*:\s*"(?:invoicely-agents:)?prompt-engineer"'
  - type: regex
    name: path-rule-enforced
    target: {source: file, path: policies/role-guard.yaml}
    pattern: 'frontend-engineer:[\s\S]*(\.test\.|\.spec\.|e2e/|tests?/)'
  - type: regex
    name: no-shouting
    target: {source: file, path: agents/frontend-engineer.md}
    pattern: '\b(NEVER|ALWAYS|MUST|CRITICAL)\b|EDIT TESTS'
    match: not_contains
  - type: llm
    name: calm-rule-with-reason
    focus: {source: file, path: agents/frontend-engineer.md}
    criteria: >
      PASS if this definition has a calmly written rule that the agent does not change tests written by test-author,
      with a "Why:" reason, and says what to do instead when a test looks wrong. FAIL if the rule is missing,
      has no reason, or is written in capitals.
  - type: file_exists
    name: regression-case-created
    path: evals/frontend-engineer/regression-edits-locked-test/case.yaml
  - type: llm
    name: applied-without-asking
    criteria: >
      PASS if the report says the change was made: the capitalised wording was replaced by an enforced path rule and a
      calm rule, with the reason for not using capitals. FAIL if the agent only asked whether it may deviate from the
      request and changed nothing.
