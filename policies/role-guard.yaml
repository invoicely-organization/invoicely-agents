# The paths each agent may write, as globs relative to the product repo.
# The role guard hook (PreToolUse on Write, Edit and Bash, INV-14) refuses a write
# outside "allow" or inside "deny" for the agent that makes it. The hook knows the
# agent from the agent_type field of the hook input.
# Each agent gets its entry when its definition is added (INV-10, INV-17).
# Change this file through a PR like any prompt; Yoan approves.
prompt-engineer:
  allow: ["agents/**", "skills/**", "evals/**", "templates/**", "fixtures/eval-workspace/**", "policies/role-guard.yaml"]
# The reviewer reads and reports; it writes nothing (INV-31).
reviewer:
  allow: []
