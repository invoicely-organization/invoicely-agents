# The paths each agent may write, as globs relative to the repo the task is in (invoicely or invoicely-agents).
# The role guard hook (PreToolUse on Write and Edit) refuses a write outside "allow" or inside "deny" for the agent
# that makes it, and after every session the runner checks the session's whole diff against the same rules, so a
# write through Bash is caught too. The hook knows the agent from INVOICELY_ROLE, which the runner sets for its
# sessions, or else from the agent_type of a subagent.
# The etalons in fixtures/etalons are locked for every agent.
test-author:
  allow: ["**/*.test.ts", "**/*.test.tsx", "**/*.test.mjs", "**/*.test.js", "**/test/**", "e2e/**"]
  deny: ["fixtures/etalons/**"]
implementer:
  allow: ["**"]
  deny: ["**/*.test.ts", "**/*.test.tsx", "**/*.test.mjs", "**/*.test.js", "**/test/**", "e2e/**", "fixtures/etalons/**", "policies/**", ".github/**"]
# The reviewer reads and reports; it writes nothing.
reviewer:
  allow: []
