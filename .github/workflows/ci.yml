name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1" # every Monday: the whole eval suite
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: validate and hook tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin
        run: claude plugin validate .
      - name: Hook tests
        run: node --test hooks/test/

  evals:
    name: evals
    needs: checks
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code and the sandbox tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap socat
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Pick the agents to evaluate
        id: pick
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set, so the evals are skipped."
            echo "agents=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            agents="$(scripts/changed-agents.sh "${{ github.event.pull_request.base.sha }}" | tr '\n' ' ')"
          else
            agents="$(find agents -maxdepth 1 -name '*.md' | sed -E 's#^agents/(.*)\.md$#\1#' | tr '\n' ' ')"
          fi
          echo "agents=$agents" >> "$GITHUB_OUTPUT"
          echo "Agents to evaluate: ${agents:-none}"
      - name: Run the evals
        if: steps.pick.outputs.agents != ''
        run: |
          status=0
          for agent in ${{ steps.pick.outputs.agents }}; do
            echo "::group::$agent"
            claude plugin eval . --trust-plugin --scaffold --allow-tools Write Edit \
              --ablation none --runs 3 -j 3 --threshold 0.8 --no-publish --tag "$agent" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Keep the reports
        if: always() && steps.pick.outputs.agents != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
